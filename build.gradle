plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.alfy.budget'
version = '2.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.xerial:sqlite-jdbc'

    implementation 'com.opencsv:opencsv:5.12.0'

    // Front-end libraries, served from /webjars/... (no npm needed)
    implementation 'org.webjars:webjars-locator-lite'
    implementation 'org.webjars.npm:htmx.org:2.0.11'
    implementation 'org.webjars.npm:alpinejs:3.17.5'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The SQLite driver loads a native library; Java 25 wants that allowed explicitly.
def nativeAccess = '--enable-native-access=ALL-UNNAMED'

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs nativeAccess
    // Each test run makes its own throwaway databases here; clear out the last run's.
    doFirst { delete 'build/test-db' }
}

// The made-up database for working on the app (see MockData.java).
def mockDb = 'data/mock.db'

tasks.named('bootRun') {
    jvmArgs nativeAccess
    // Serve templates and CSS straight from src/main/resources, so edits show up on a browser refresh.
    sourceResources sourceSets.main
    // ./gradlew bootRun -Pmock runs on the mock database instead of data/budget.db.
    if (project.hasProperty('mock')) {
        environment 'DB_PATH', mockDb
    }
}

// ./gradlew mockDb: (re)makes data/mock.db with two years of made-up data ending today.
tasks.register('mockDb', JavaExec) {
    group = 'application'
    description = "Makes $mockDb with two years of made-up data ending today."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.alfy.budget.tools.MockData'
    jvmArgs nativeAccess
    args mockDb
    doFirst { delete fileTree('data') { include 'mock.db*' } }
}

// Only build the runnable jar, so the Dockerfile's build/libs/*.jar matches exactly one file.
tasks.named('jar') {
    enabled = false
}
