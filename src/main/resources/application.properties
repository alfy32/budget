server.port=${SERVER_PORT:8081}
server.compression.enabled=true

# The whole database is this one file. Open it in IntelliJ (Database > + > SQLite)
# or with `sqlite3 data/budget.db`. WAL lets you edit it while the app is running.
budget.db-path=${DB_PATH:data/budget.db}
spring.datasource.url=jdbc:sqlite:${budget.db-path}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
spring.datasource.hikari.maximum-pool-size=4

# Template caching is turned off automatically by spring-boot-devtools when running locally.

# Always show money as US dollars, whatever the server's locale is.
spring.web.locale=en_US
spring.web.locale-resolver=fixed
