<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${category.name})}"></head>
<body>
<header th:replace="~{layout :: topbar(${category.name}, @{/categories})}"></header>
<main>
    <!-- Each field saves as soon as it changes, same as the budget page. -->
    <div class="card padded" x-data="{ saved: '' }"
         @htmx:after-request="if ($event.detail.successful) { saved = $event.detail.elt.name; setTimeout(() => saved = '', 1500) }">
        <label class="field">
            <span class="field-label">Name <span class="saved" x-show="saved === 'name'" x-cloak>Saved</span></span>
            <input type="text" name="name" th:value="${category.name}" th:hx-post="@{/categories/{id}/name(id=${category.id})}" hx-swap="none">
        </label>

        <label class="field">
            <span class="field-label">Budget <span class="saved" x-show="saved === 'budgetId'" x-cloak>Saved</span></span>
            <select name="budgetId" th:hx-post="@{/categories/{id}/budget(id=${category.id})}" hx-swap="none">
                <option value="">No budget</option>
                <option th:each="budget : ${budgets}" th:value="${budget.id}" th:text="${budget.name}"
                        th:selected="${category.budget != null && category.budget.id == budget.id}"></option>
            </select>
        </label>

        <label class="field">
            <span class="field-label">Account <span class="saved" x-show="saved === 'accountId'" x-cloak>Saved</span></span>
            <select name="accountId" th:hx-post="@{/categories/{id}/account(id=${category.id})}" hx-swap="none">
                <option value="">No account</option>
                <option th:each="account : ${accounts}" th:value="${account.id}" th:text="${account.name}"
                        th:selected="${category.accountId == account.id}"></option>
            </select>
        </label>
    </div>

    <div class="danger-zone" x-data="{ sure: false }">
        <button class="btn danger" type="button" x-show="!sure" @click="sure = true">Delete category</button>
        <form x-show="sure" x-cloak method="post" th:action="@{/categories/{id}/delete(id=${category.id})}">
            <p class="hint">Its transactions go back to needing a category.</p>
            <div class="buttons">
                <button class="btn secondary" type="button" @click="sure = false">Keep it</button>
                <button class="btn danger solid" type="submit">Delete</button>
            </div>
        </form>
    </div>
</main>
<nav th:replace="~{layout :: tabs('home')}"></nav>
</body>
</html>
