<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${budget.name})}"></head>
<body>
<header th:replace="~{layout :: topbar(${budget.name}, @{/budgets})}"></header>
<main>
    <!--
      Each field saves on its own as soon as it changes (htmx posts it; the server answers with
      nothing to swap). "Saved" flashes next to the label so you know it worked.
    -->
    <div class="card padded" x-data="{ saved: '' }"
         @htmx:after-request="if ($event.detail.successful) { saved = $event.detail.elt.name; setTimeout(() => saved = '', 1500) }">
        <label class="field">
            <span class="field-label">Name <span class="saved" x-show="saved === 'name'" x-cloak>Saved</span></span>
            <input type="text" name="name" th:value="${budget.name}" th:hx-post="@{/budgets/{id}/name(id=${budget.id})}" hx-swap="none">
        </label>

        <div class="field">
            <span class="field-label">In the current plan</span>
            <a class="row" style="padding: 0; min-height: 0; border: none;" th:href="@{/plans/current}">
                <span class="main" th:text="|${#numbers.formatCurrency(budget.amount)} per month|">$0.00 per month</span>
                <span class="small">Edit in plan</span>
                <svg th:replace="~{layout :: chevron}"></svg>
            </a>
        </div>

        <label class="field">
            <span class="field-label">Group <span class="saved" x-show="saved === 'group'" x-cloak>Saved</span></span>
            <select name="group" th:hx-post="@{/budgets/{id}/group(id=${budget.id})}" hx-swap="none">
                <option th:each="group : ${groups}" th:value="${group.dbValue}" th:text="|${group.label}: ${group.description}|"
                        th:selected="${budget.group == group}"></option>
            </select>
        </label>

        <label class="field">
            <span class="field-label">Transfer account <span class="saved" x-show="saved === 'transferAccount'" x-cloak>Saved</span></span>
            <input type="text" name="transferAccount" th:value="${budget.transferAccount}" placeholder="None"
                   th:hx-post="@{/budgets/{id}/transfer-account(id=${budget.id})}" hx-swap="none">
        </label>

        <label class="field" style="display: flex; align-items: center; gap: 12px; margin-top: 16px;">
            <span style="flex: 1;">Watch on the Month page <span class="saved" x-show="saved === 'monthly'" x-cloak>Saved</span>
                <span class="hint" style="display: block;">For budgets you might act on during the month, not regular bills.</span></span>
            <input class="switch" type="checkbox" name="monthly" value="true" th:checked="${budget.monthly}"
                   th:hx-post="@{/budgets/{id}/monthly(id=${budget.id})}" hx-swap="none">
        </label>
    </div>

    <div class="section-title">Categories</div>
    <div class="card">
        <div class="row muted" th:if="${categories.isEmpty()}">None yet. Pick a budget on a category's page.</div>
        <a class="row" th:each="category : ${categories}" th:href="@{/categories/{id}(id=${category.id})}">
            <div class="main" th:text="${category.name}">Category</div>
            <svg th:replace="~{layout :: chevron}"></svg>
        </a>
    </div>

    <div class="card padded warning" th:if="${param.error != null}" th:text="${param.error}" style="margin-top: 24px;">Error</div>

    <div class="danger-zone" x-data="{ sure: false }">
        <button class="btn danger" type="button" x-show="!sure" @click="sure = true">Delete budget</button>
        <form x-show="sure" x-cloak method="post" th:action="@{/budgets/{id}/delete(id=${budget.id})}">
            <p class="hint">Its categories stay; they just won't have a budget.</p>
            <div class="buttons">
                <button class="btn secondary" type="button" @click="sure = false">Keep it</button>
                <button class="btn danger solid" type="submit">Delete</button>
            </div>
        </form>
    </div>
</main>
<nav th:replace="~{layout :: tabs('home')}"></nav>
</body>
</html>
