<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Budgets')}"></head>
<body>
<header th:replace="~{layout :: topbar('Budget settings', @{/})}"></header>
<main>
    <p class="hint" style="margin: 0 4px 10px 4px;">Amounts come from the current plan. Change them in the <a th:href="@{/plans/current}">plan</a>.</p>
    <div class="card">
        <a class="row" th:each="budget : ${budgets}" th:href="@{/budgets/{id}(id=${budget.id})}">
            <div class="main">
                <div class="title" th:text="${budget.name}">Budget</div>
                <div class="sub">
                    <span th:text="${budget.group.label}">Monthly</span>
                    <span th:if="${budget.monthly}"> · Watched</span>
                    <span th:if="${budget.transferAccount != null}" th:text="| · From ${budget.transferAccount}|"></span>
                </div>
            </div>
            <div class="amount" th:text="|${#numbers.formatCurrency(budget.amount)}/mo|">$0/mo</div>
            <svg th:replace="~{layout :: chevron}"></svg>
        </a>
    </div>

    <div class="section-title">New budget</div>
    <form class="card padded" method="post" th:action="@{/budgets}">
        <input type="text" name="name" placeholder="Name" required>
        <div class="buttons"><button class="btn" type="submit">Add budget</button></div>
    </form>
</main>
<nav th:replace="~{layout :: tabs('home')}"></nav>
</body>
</html>
