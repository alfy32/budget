<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Monthly')}"></head>
<body>
<header th:replace="~{layout :: topbar('Budgets', null)}"></header>
<main>
    <div class="segmented" style="margin-bottom: 12px;">
        <a class="seg-link active" th:href="@{/monthly}">Month</a>
        <a class="seg-link" th:href="@{/yearly}">Year</a>
        <a class="seg-link" th:href="@{/needs-transferred}">Transfer</a>
    </div>

    <div class="period">
        <a class="icon-btn" th:href="@{/monthly(date=${previous})}" aria-label="Previous month"><svg th:replace="~{layout :: left}"></svg></a>
        <div class="label">
            <span th:text="${#temporals.format(date, 'MMMM yyyy')}">Month</span>
            <a th:unless="${isCurrent}" th:href="@{/monthly}">Back to this month</a>
        </div>
        <a class="icon-btn" th:href="@{/monthly(date=${next})}" aria-label="Next month"><svg th:replace="~{layout :: right}"></svg></a>
    </div>

    <div class="empty" th:if="${budgets.isEmpty()}">No budgets are set to show monthly. Turn it on in a budget's settings.</div>

    <th:block th:each="b : ${budgets}">
        <div th:replace="~{budget-fragments :: budget-card(${b}, ${start}, ${end}, false)}"></div>
    </th:block>
</main>
<nav th:replace="~{layout :: tabs('budgets')}"></nav>
</body>
</html>
