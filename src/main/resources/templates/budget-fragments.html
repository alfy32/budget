<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  One budget as a card: name, how much is left (or over), a bar, and its categories.
    b         a BudgetInfo
    query     how a category row links to its transactions, e.g. 'category,{id},2026-11-01,2026-11-30'
              (written with {id} where the category id goes)
    expected  true on the yearly page: draws a tick where spending "should" be by today
-->
<div th:fragment="budget-card(b, start, end, expected)" class="card"
     th:with="left=${b.budget.amount.subtract(b.total)}, percent=${b.percent}">
    <a class="budget-head" th:href="@{/budgets/{id}(id=${b.budget.id})}">
        <div class="top">
            <span class="name" th:text="${b.budget.name}">Budget</span>
            <span th:if="${left.signum() >= 0}" class="muted small" th:text="|${#numbers.formatCurrency(left)} left|">$0 left</span>
            <span th:if="${left.signum() < 0}" class="over-text small" th:text="|${#numbers.formatCurrency(left.negate())} over|">$0 over</span>
        </div>
        <div class="bar">
            <div class="fill" th:classappend="${percent >= 100 ? 'over' : (percent > 80 ? 'high' : '')}"
                 th:style="|width: ${percent < 0 ? 0 : (percent > 100 ? 100 : percent)}%|"></div>
            <div class="expected" th:if="${expected}"
                 th:style="|left: ${b.expectedPercent > 100 ? 100 : b.expectedPercent}%|"></div>
        </div>
        <div class="numbers">
            <span th:text="|${#numbers.formatCurrency(b.total)} of ${#numbers.formatCurrency(b.budget.amount)}|">$0 of $0</span>
            <span th:text="${expected} ? |${percent}% · on pace ${b.expectedPercent}%| : |${percent}%|">0%</span>
        </div>
    </a>
    <a class="row" th:each="c : ${b.categories}"
       th:href="@{/transactions(query=${start == null ? 'category,' + c.category.id + ',needsTransferred' : 'category,' + c.category.id + ',' + start + ',' + end})}">
        <div class="main small" th:text="${c.category.name}">Category</div>
        <div class="amount small" th:text="${#numbers.formatCurrency(c.total)}">$0.00</div>
        <svg th:replace="~{layout :: chevron}"></svg>
    </a>
</div>

</body>
</html>
