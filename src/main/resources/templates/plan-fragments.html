<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  One section of pay lines. Each line: its name, $ or % (of gross / of taxable), the value, whether it counts as
  retirement, and what it comes to in the chosen unit with % of gross. The hidden payValue_ is per year (or the %).
-->
<th:block th:fragment="paySection(section, items)">
    <div class="pay-section-title" th:text="${section.label}">Before tax</div>
    <div class="pay-item" th:each="item : ${items}" th:x-data="|{ id: '${item.id}' }|">
        <div class="pay-row">
            <input class="pay-name" type="text" th:name="|payName_${item.id}|" th:value="${item.name}" aria-label="Name">
            <span class="pay-amount" x-text="money(perUnit(payAmount(id)))"></span>
            <span class="pct" x-text="pct(payAmount(id))"></span>
        </div>
        <div class="pay-row">
            <select th:name="|payKind_${item.id}|" x-model="pay[id].kind" aria-label="Dollars or percent">
                <option value="amount">$</option>
                <option value="gross">% of gross</option>
                <option value="taxable" th:if="${section.name() != 'PRETAX'}">% of taxable</option>
            </select>
            <input type="number" step="0.01" min="0" inputmode="decimal" aria-label="Value"
                   :value="pay[id].kind === 'amount' ? perUnit(pay[id].value).toFixed(2) : pay[id].value"
                   @change="pay[id].value = pay[id].kind === 'amount' ? toYear($event.target.value) : Number($event.target.value)">
            <input type="hidden" th:name="|payValue_${item.id}|" :value="pay[id].value">
            <label class="retire"><input type="checkbox" th:name="|payRetirement_${item.id}|" x-model="pay[id].retirement"> Retirement</label>
            <button class="link-button danger-text" type="submit" name="action" th:value="|removePay:${item.id}|" aria-label="Remove">✕</button>
        </div>
    </div>
    <div class="pay-add">
        <input type="text" th:name="|newPayName_${section.dbValue}|" th:placeholder="|Add to ${section.label}|" aria-label="New line name">
        <button class="btn inline secondary" type="submit" name="action" th:value="|addPay:${section.dbValue}|">Add</button>
    </div>
</th:block>

</body>
</html>
