<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${title})}"></head>
<body>
<header th:replace="~{layout :: topbar(${title}, ${back})}"></header>
<main>
    <!-- Typing filters the list: htmx re-requests this page and swaps in just #list. -->
    <form class="search" th:action="@{/transactions}" method="get"
          th:hx-get="@{/transactions}" hx-trigger="input changed delay:250ms from:find input, submit"
          hx-target="#list" hx-select="#list" hx-swap="outerHTML" hx-push-url="true">
        <input type="hidden" name="query" th:value="${query}" th:if="${query}">
        <input type="search" name="search" th:value="${search}" placeholder="Search description or notes"
               autocomplete="off" enterkeyhint="search">
    </form>

    <div id="list">
        <div class="empty" th:if="${days.isEmpty()}"
             th:text="${search != null ? 'No matches' : (query == 'needsCategorized' ? 'All caught up. Nothing to categorize.' : (query == 'needsTransferred' ? 'Nothing to transfer.' : 'No transactions'))}">
            No transactions
        </div>

        <!-- One batch of transactions. Later batches are fetched on their own as you scroll. -->
        <th:block th:fragment="batch">
            <span data-batch hidden></span>
            <th:block th:each="day : ${days}">
                <div class="day" th:unless="${day.continued()}" th:text="${day.label()}">Today</div>
                <div class="card" th:classappend="${day.continued()} ? continued">
                    <a class="row" th:each="t : ${day.transactions()}" th:href="@{/transactions/{id}(id=${t.id}, query=${query})}">
                        <div class="main">
                            <div class="title clamp" th:text="${t.description}">Description</div>
                            <div class="sub">
                                <span th:if="${t.category != null}" th:text="${t.category.name}">Category</span>
                                <span th:if="${t.category == null}" class="badge">Needs category</span>
                                <span th:if="${t.splitIndex > 0}"> · Split</span>
                            </div>
                        </div>
                        <div class="amount"><span th:replace="~{layout :: money(${t})}"></span></div>
                    </a>
                </div>
            </th:block>

            <!-- When this scrolls into view, htmx replaces it with the next batch (which ends with its own placeholder). -->
            <div class="loading-more" th:if="${nextUrl != null}"
                 th:hx-get="${nextUrl}" hx-trigger="revealed" hx-swap="outerHTML">Loading more…</div>
        </th:block>
    </div>
</main>
<nav th:replace="~{layout :: tabs(${tab})}"></nav>
</body>
</html>
