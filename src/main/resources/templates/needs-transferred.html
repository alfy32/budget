<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Needs transferred')}"></head>
<body>
<header th:replace="~{layout :: topbar('Budgets', null)}"></header>
<main>
    <div class="segmented" style="margin-bottom: 12px;">
        <a class="seg-link" th:href="@{/monthly}">Month</a>
        <a class="seg-link" th:href="@{/yearly}">Year</a>
        <a class="seg-link active" th:href="@{/needs-transferred}">Transfer</a>
    </div>

    <div class="empty" th:if="${transfers.isEmpty()}">Nothing to transfer.</div>

    <th:block th:each="transfer : ${transfers}">
        <div class="card hero spaced" style="padding: 16px;">
            <div class="sub" th:text="|Move to ${transfer.account}|">Move to Savings</div>
            <div class="big" th:text="${#numbers.formatCurrency(transfer.amount)}">$0.00</div>
            <form method="post" th:action="@{/needs-transferred/mark}" x-data="{ sure: false }" style="margin-top: 10px;">
                <input type="hidden" name="account" th:value="${transfer.account}">
                <button class="btn secondary" type="button" x-show="!sure" @click="sure = true">I've transferred it</button>
                <div class="buttons" x-show="sure" x-cloak style="margin-top: 0;">
                    <button class="btn secondary" type="button" @click="sure = false">Not yet</button>
                    <button class="btn" type="submit">Yes, mark done</button>
                </div>
            </form>
        </div>

        <div class="card spaced">
            <th:block th:each="b : ${transfer.budgets}">
                <a class="row" th:href="@{/budgets/{id}(id=${b.budget.id})}">
                    <div class="main title" th:text="${b.budget.name}">Budget</div>
                    <div class="amount" th:text="${#numbers.formatCurrency(b.total)}">$0.00</div>
                    <svg th:replace="~{layout :: chevron}"></svg>
                </a>
                <a class="row" th:each="c : ${b.categories}" th:href="@{/transactions(query=|category,${c.category.id},needsTransferred|)}"
                   style="padding-left: 28px;">
                    <div class="main small muted" th:text="${c.category.name}">Category</div>
                    <div class="amount small muted" th:text="${#numbers.formatCurrency(c.total)}">$0.00</div>
                    <svg th:replace="~{layout :: chevron}"></svg>
                </a>
            </th:block>
        </div>
    </th:block>
</main>
<nav th:replace="~{layout :: tabs('budgets')}"></nav>
</body>
</html>
