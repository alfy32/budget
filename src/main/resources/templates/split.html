<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Split')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<main x-data="split">
    <div class="title">Original Transaction</div>
    <div class="big-amount" th:text="${#numbers.formatCurrency(bankTransaction.amount)}">$0.00</div>
    <div class="big-description" th:text="${bankTransaction.description}">Description</div>
    <div class="centered" th:text="${#temporals.format(bankTransaction.transactionDate, 'MMM d, yyyy')}">Date</div>
    <div class="centered" th:text="${bankTransaction.account}">Account</div>

    <br>
    <div class="title">Split Transactions</div>
    <p class="hint">The first row gets whatever is left over.</p>

    <form method="post" th:action="@{/split/{id}(id=${bankTransaction.id})}">
        <input type="hidden" name="query" th:if="${query}" th:value="${query}">

        <template x-for="(row, i) in rows" :key="i">
            <div class="split-row">
                <input type="hidden" :name="`rows[${i}].id`" :value="row.id">
                <select :name="`rows[${i}].categoryId`" x-model="row.categoryId">
                    <option value="">Needs Categorized</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                </select>
                <!-- The first row is read-only and always shows the remainder. -->
                <input x-show="i === 0" type="text" readonly :value="first.toFixed(2)" :class="first < 0 && 'warning'">
                <input x-show="i > 0" type="number" step="0.01" inputmode="decimal"
                       :name="`rows[${i}].amount`" x-model.number="row.amount">
                <button x-show="i > 0" class="button" type="button" @click="rows.splice(i, 1)">Delete</button>
            </div>
        </template>

        <p class="warning" x-show="first < 0" x-cloak>The other rows add up to more than the original amount.</p>

        <button class="button" type="button" @click="add()">Add</button>
        <button class="button" type="submit" :disabled="first < 0">Save</button>
    </form>
    <hr>
    <a class="button" th:href="@{/transactions/{id}(id=${rows[0].id}, query=${query})}">Done</a>

    <script th:inline="javascript">
        document.addEventListener('alpine:init', () => {
            Alpine.data('split', () => ({
                original: Number(/*[[${bankTransaction.amount}]]*/ 0),
                rows: /*[[${rows}]]*/ [],

                init() {
                    this.rows.forEach(row => row.amount = Number(row.amount));
                },

                // Original amount minus every row except the first.
                get first() {
                    const rest = this.rows.slice(1).reduce((sum, row) => sum + (Number(row.amount) || 0), 0);
                    return Math.round((this.original - rest) * 100) / 100;
                },

                add() {
                    this.rows.push({id: '', categoryId: this.rows[0].categoryId, amount: 0});
                },
            }));
        });
    </script>
</main>
</body>
</html>
