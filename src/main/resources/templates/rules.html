<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Auto-categorize')}"></head>
<body>
<header th:replace="~{layout :: topbar('Auto-categorize', @{/})}"></header>
<main>
    <p class="hint" style="margin: 0 4px 12px 4px;">
        When you upload a bank CSV, new transactions get a category from the first rule that matches their bank
        description. Upper/lower case doesn't matter.
    </p>

    <a class="btn" th:href="@{/rules/new}">New rule</a>

    <div class="card spaced">
        <div class="row muted" th:if="${rules.isEmpty()}">No rules yet</div>
        <a class="row" th:each="rule : ${rules}" th:href="@{/rules/{id}(id=${rule.id})}">
            <div class="main">
                <div class="sub" th:text="${rule.matchType.label}">Contains</div>
                <div class="title" th:text="${rule.description}">AMAZON MKTPL</div>
            </div>
            <div class="value small" th:text="${rule.categoryName}">Category</div>
            <svg th:replace="~{layout :: chevron}"></svg>
        </a>
    </div>
</main>
<nav th:replace="~{layout :: tabs('home')}"></nav>
</body>
</html>
