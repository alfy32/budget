<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Home')}"></head>
<body>
<header th:replace="~{layout :: topbar('Budget', null)}"></header>
<main>
    <div class="tiles">
        <a class="tile" th:classappend="${needsCategorized > 0} ? attention" th:href="@{/transactions(query='needsCategorized')}">
            <div class="number" th:text="${needsCategorized}">0</div>
            <div class="label">to categorize</div>
        </a>
        <a class="tile" th:classappend="${transfers.count() > 0} ? attention" th:href="@{/needs-transferred}">
            <div class="number" th:text="${transfers.count()}">0</div>
            <div class="label" th:text="${transfers.count() > 0} ? |to transfer · ${#numbers.formatCurrency(transfers.amount())}| : 'to transfer'">to transfer</div>
        </a>
    </div>

    <div class="buttons">
        <a class="btn" th:href="@{/transactions-upload}">Upload bank CSV</a>
        <a class="btn secondary" th:href="@{/create-transaction}">Add by hand</a>
    </div>

    <div class="section-title" th:unless="${accounts.isEmpty()}">Accounts</div>
    <div class="card" th:unless="${accounts.isEmpty()}">
        <a class="row" th:each="account : ${accounts}" th:href="@{/accounts/{id}(id=${account.id})}">
            <div class="main title" th:text="${account.name}">Account</div>
            <div class="amount" th:classappend="${account.balance.signum() < 0} ? negative"
                 th:text="${#numbers.formatCurrency(account.balance)}">$0.00</div>
            <svg th:replace="~{layout :: chevron}"></svg>
        </a>
    </div>

    <div class="section-title">Reports</div>
    <div class="card">
        <a class="row" th:href="@{/monthly}"><div class="main">This month</div><svg th:replace="~{layout :: chevron}"></svg></a>
        <a class="row" th:href="@{/yearly}"><div class="main">This year</div><svg th:replace="~{layout :: chevron}"></svg></a>
        <a class="row" th:href="@{/needs-transferred}"><div class="main">Transfers</div><svg th:replace="~{layout :: chevron}"></svg></a>
    </div>

    <div class="section-title">Setup</div>
    <div class="card">
        <a class="row" th:href="@{/budgets}"><div class="main">Budgets</div><svg th:replace="~{layout :: chevron}"></svg></a>
        <a class="row" th:href="@{/categories}"><div class="main">Categories</div><svg th:replace="~{layout :: chevron}"></svg></a>
        <a class="row" th:href="@{/accounts}"><div class="main">Accounts</div><svg th:replace="~{layout :: chevron}"></svg></a>
        <a class="row" th:href="@{/rules}"><div class="main">Auto-categorize rules</div><svg th:replace="~{layout :: chevron}"></svg></a>
    </div>
</main>
<nav th:replace="~{layout :: tabs('home')}"></nav>
</body>
</html>
