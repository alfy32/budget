<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${account.name})}"></head>
<body>
<header th:replace="~{layout :: topbar(${account.name}, @{/accounts})}"></header>
<main th:x-data="|{ settings: ${account.categoryCount == 0} }|">
    <div class="card hero">
        <div class="sub">Balance</div>
        <div class="big" th:classappend="${account.balance.signum() < 0} ? negative"
             th:text="${#numbers.formatCurrency(account.balance)}">$0.00</div>
        <button class="btn plain inline" type="button" style="margin: 6px auto 0 auto;" @click="settings = !settings"
                x-text="settings ? 'Hide settings' : 'Settings'">Settings</button>
    </div>

    <div x-show="settings" x-cloak>
        <div class="section-title">Name</div>
        <div class="card padded" x-data="{ saved: false }"
             @htmx:after-request="if ($event.detail.successful) { saved = true; setTimeout(() => saved = false, 1500) }">
            <input type="text" name="name" th:value="${account.name}" aria-label="Name"
                   th:hx-post="@{/accounts/{id}/name(id=${account.id})}" hx-swap="none">
            <div class="saved small" x-show="saved" x-cloak style="margin-top: 6px;">Saved</div>
        </div>

        <form method="post" th:action="@{/accounts/{id}/categories(id=${account.id})}">
            <div class="section-title">Categories that count toward it</div>
            <div class="card">
                <label class="row tappable" th:each="category : ${categories}">
                    <span class="main">
                        <span th:text="${category.name}">Category</span>
                        <span class="sub" style="display: block;" th:if="${category.accountId != null && category.accountId != account.id}"
                              th:text="|In ${accountNames[category.accountId]}|"></span>
                    </span>
                    <input class="tick" type="checkbox" name="categoryId" th:value="${category.id}"
                           th:checked="${category.accountId == account.id}">
                </label>
            </div>
            <div class="action-bar">
                <button class="btn" type="submit">Save categories</button>
            </div>
        </form>

        <div class="danger-zone" x-data="{ sure: false }" style="margin-top: 24px;">
            <button class="btn danger" type="button" x-show="!sure" @click="sure = true">Delete account</button>
            <form x-show="sure" x-cloak method="post" th:action="@{/accounts/{id}/delete(id=${account.id})}">
                <p class="hint">Transactions and categories stay; they just stop counting toward this account.</p>
                <div class="buttons">
                    <button class="btn secondary" type="button" @click="sure = false">Keep it</button>
                    <button class="btn danger solid" type="submit">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <div class="section-title">History</div>
    <div class="card">
        <div class="row muted" th:if="${history.isEmpty()}">No transactions yet. Pick categories in Settings.</div>
        <a class="row" th:each="entry : ${history}" th:with="t=${entry.transaction()}"
           th:href="@{/transactions/{id}(id=${t.id})}">
            <div class="main">
                <div class="title clamp" th:text="${t.description}">Description</div>
                <div class="sub" th:text="|${#temporals.format(t.transactionDate, 'MMM d, yyyy')} · ${categoryNames[t.category.id]}|">Date · Category</div>
            </div>
            <div class="amount">
                <div th:classappend="${t.credit()} ? credit" th:text="${(t.credit() ? '+' : '−') + #numbers.formatCurrency(t.amount)}">+$0.00</div>
                <div class="sub" th:classappend="${entry.balanceAfter().signum() < 0} ? negative"
                     th:text="${#numbers.formatCurrency(entry.balanceAfter())}">$0.00</div>
            </div>
        </a>
    </div>
</main>
<nav th:replace="~{layout :: tabs('accounts')}"></nav>
</body>
</html>
