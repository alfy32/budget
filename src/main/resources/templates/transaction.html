<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Transaction')}"></head>
<body>
<header th:replace="~{layout :: topbar('Transaction', @{/transactions(query=${query})})}"></header>
<main th:with="t=${transaction}, bank=${transaction.bankTransaction}">
    <!--
      How editing works on this page:
        - Alpine (x-data / x-show) flips a row between showing its value and showing a small form.
        - The form posts with htmx (th:hx-post). The server saves, then sends back this page, and
          htmx swaps in the fresh #transaction section so you stay where you were on the page.
    -->
    <div id="transaction" hx-target="this" hx-select="#transaction" hx-swap="outerHTML">

        <div class="card hero">
            <div class="big"><span th:replace="~{layout :: money(${t})}"></span></div>
            <div class="title" th:text="${t.description}">Description</div>
            <div class="sub" th:text="|${#temporals.format(t.transactionDate, 'MMM d, yyyy')} · ${t.account}|">Date · Account</div>
        </div>

        <div class="section-title">Sort it</div>
        <div class="card">
            <a class="row" th:href="@{/transactions/{id}/category(id=${t.id}, query=${query})}">
                <div class="main">Category</div>
                <div class="value" th:if="${t.category != null}" th:text="${t.category.name}">Groceries</div>
                <span class="badge" th:if="${t.category == null}">Choose</span>
                <svg th:replace="~{layout :: chevron}"></svg>
            </a>
            <a class="row" th:href="@{/transactions/{id}/tags(id=${t.id}, query=${query})}">
                <div class="main">Tags</div>
                <div class="value" th:text="${t.tags != null ? t.tags : 'None'}">None</div>
                <svg th:replace="~{layout :: chevron}"></svg>
            </a>
            <a class="row" th:href="@{/split/{id}(id=${bank.id}, query=${query})}">
                <div class="main">Split</div>
                <div class="value" th:text="${t.splitIndex > 0 ? 'Split' : 'Not split'}">Not split</div>
                <svg th:replace="~{layout :: chevron}"></svg>
            </a>
            <form class="row" th:hx-post="@{/transactions/{id}/needs-transferred(id=${t.id})}" hx-trigger="change">
                <input type="hidden" name="query" th:if="${query}" th:value="${query}">
                <label class="main" th:for="'transferred'">Needs transferred</label>
                <input id="transferred" class="switch" type="checkbox" th:checked="${t.needsTransferred}">
            </form>
        </div>
        <a class="hint" th:if="${t.category != null}" style="display:block; margin: 8px 4px 0 4px;"
           th:href="@{/rules(description=${bank.description}, categoryId=${t.category.id})}">
            Always put "<span th:text="${bank.description}"></span>" in <span th:text="${t.category.name}"></span>
        </a>

        <div class="section-title">Details</div>
        <div class="card">

            <div x-data="{ editing: false }">
                <div class="row tappable" x-show="!editing" @click="editing = true; $nextTick(() => $refs.input.focus())">
                    <div class="main">
                        <div class="sub">Notes</div>
                        <div th:text="${t.notes != null ? t.notes : 'Add a note'}" th:classappend="${t.notes == null} ? muted">Add a note</div>
                    </div>
                </div>
                <form class="edit" x-show="editing" x-cloak th:hx-post="@{/transactions/{id}/notes(id=${t.id})}">
                    <input type="hidden" name="query" th:if="${query}" th:value="${query}">
                    <div class="field-label">Notes</div>
                    <input type="text" name="notes" x-ref="input" th:value="${t.notes}" enterkeyhint="done">
                    <div class="buttons">
                        <button class="btn secondary" type="button" @click="editing = false; $el.form.reset()">Cancel</button>
                        <button class="btn" type="submit">Save</button>
                    </div>
                </form>
            </div>

            <div x-data="{ editing: false }">
                <div class="row tappable" x-show="!editing" @click="editing = true; $nextTick(() => $refs.input.focus())">
                    <div class="main">
                        <div class="sub">Description</div>
                        <div th:text="${t.description}">Description</div>
                    </div>
                </div>
                <div class="edit" x-show="editing" x-cloak>
                    <form th:hx-post="@{/transactions/{id}/description(id=${t.id})}">
                        <input type="hidden" name="query" th:if="${query}" th:value="${query}">
                        <div class="field-label">Description</div>
                        <input type="text" name="description" x-ref="input" th:value="${t.description}" enterkeyhint="done">
                        <div class="hint spaced" th:text="|Bank: ${bank.description}|"></div>
                        <div class="buttons">
                            <button class="btn secondary" type="button" @click="editing = false; $el.form.reset()">Cancel</button>
                            <button class="btn" type="submit">Save</button>
                        </div>
                    </form>
                    <form th:hx-post="@{/transactions/{id}/description/reset(id=${t.id})}">
                        <input type="hidden" name="query" th:if="${query}" th:value="${query}">
                        <button class="btn plain" type="submit">Use the bank's description</button>
                    </form>
                </div>
            </div>

            <div x-data="{ editing: false }">
                <div class="row tappable" x-show="!editing" @click="editing = true; $nextTick(() => $refs.input.focus())">
                    <div class="main">
                        <div class="sub">Amount</div>
                        <div th:text="${#numbers.formatCurrency(t.amount)}">$0.00</div>
                    </div>
                </div>
                <form class="edit" x-show="editing" x-cloak th:hx-post="@{/transactions/{id}/amount(id=${t.id})}">
                    <input type="hidden" name="query" th:if="${query}" th:value="${query}">
                    <div class="field-label">Amount</div>
                    <input type="number" step="0.01" inputmode="decimal" name="amount" x-ref="input" th:value="${t.amount}">
                    <div class="hint spaced" th:text="|Bank: ${#numbers.formatCurrency(bank.amount)}|"></div>
                    <div class="buttons">
                        <button class="btn secondary" type="button" @click="editing = false; $el.form.reset()">Cancel</button>
                        <button class="btn" type="submit">Save</button>
                    </div>
                </form>
            </div>

            <div x-data="{ editing: false }">
                <div class="row tappable" x-show="!editing" @click="editing = true">
                    <div class="main">
                        <div class="sub">Date</div>
                        <div th:text="${#temporals.format(t.transactionDate, 'EEEE, MMMM d, yyyy')}">Date</div>
                    </div>
                </div>
                <form class="edit" x-show="editing" x-cloak th:hx-post="@{/transactions/{id}/date(id=${t.id})}">
                    <input type="hidden" name="query" th:if="${query}" th:value="${query}">
                    <div class="field-label">Date</div>
                    <input type="date" name="date" th:value="${t.transactionDate}">
                    <div class="hint spaced" th:text="|Bank: ${#temporals.format(bank.transactionDate, 'MMM d, yyyy')}|"></div>
                    <div class="buttons">
                        <button class="btn secondary" type="button" @click="editing = false; $el.form.reset()">Cancel</button>
                        <button class="btn" type="submit">Save</button>
                    </div>
                </form>
            </div>

            <div x-data="{ editing: false }">
                <div class="row tappable" x-show="!editing" @click="editing = true">
                    <div class="main">
                        <div class="sub">Type</div>
                        <div th:text="${t.credit() ? 'Credit (money in)' : 'Debit (money out)'}">Debit</div>
                    </div>
                </div>
                <form class="edit" x-show="editing" x-cloak th:hx-post="@{/transactions/{id}/type(id=${t.id})}">
                    <input type="hidden" name="query" th:if="${query}" th:value="${query}">
                    <div class="segmented">
                        <label><input type="radio" name="transactionType" value="debit" th:checked="${t.debit()}"><span>Debit</span></label>
                        <label><input type="radio" name="transactionType" value="credit" th:checked="${t.credit()}"><span>Credit</span></label>
                    </div>
                    <div class="buttons">
                        <button class="btn secondary" type="button" @click="editing = false; $el.form.reset()">Cancel</button>
                        <button class="btn" type="submit">Save</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="danger-zone" x-data="{ sure: false }">
            <button class="btn danger" type="button" x-show="!sure" @click="sure = true">Delete transaction</button>
            <form x-show="sure" x-cloak method="post" th:action="@{/transactions/{id}/delete(id=${t.id})}">
                <input type="hidden" name="query" th:if="${query}" th:value="${query}">
                <div class="buttons">
                    <button class="btn secondary" type="button" @click="sure = false">Keep it</button>
                    <button class="btn danger solid" type="submit">Delete</button>
                </div>
            </form>
        </div>
    </div>
</main>
<nav th:replace="~{layout :: tabs(${query == 'needsCategorized' ? 'categorize' : 'transactions'})}"></nav>
</body>
</html>
