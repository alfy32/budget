<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Yearly')}"></head>
<body>
<header th:replace="~{layout :: topbar('Budgets', null)}"></header>
<main>
    <div class="segmented" style="margin-bottom: 12px;">
        <a class="seg-link" th:href="@{/monthly}">Month</a>
        <a class="seg-link active" th:href="@{/yearly}">Year</a>
        <a class="seg-link" th:href="@{/needs-transferred}">Transfer</a>
    </div>

    <div class="period">
        <a class="icon-btn" th:href="@{/yearly(date=${previous})}" aria-label="Previous year"><svg th:replace="~{layout :: left}"></svg></a>
        <div class="label">
            <span th:text="${date.year}">Year</span>
            <a th:unless="${isCurrent}" th:href="@{/yearly}">Back to this year</a>
        </div>
        <a class="icon-btn" th:href="@{/yearly(date=${next})}" aria-label="Next year"><svg th:replace="~{layout :: right}"></svg></a>
    </div>
    <p class="hint" style="margin: -4px 4px 12px 4px;">The tick on each bar is where spending would be if it were spread evenly over the year.</p>

    <th:block th:each="b : ${budgets}">
        <div th:replace="~{budget-fragments :: budget-card(${b}, ${start}, ${end}, true)}"></div>
    </th:block>
</main>
<nav th:replace="~{layout :: tabs('budgets')}"></nav>
</body>
</html>
