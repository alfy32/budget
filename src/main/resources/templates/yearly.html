<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Yearly')}"></head>
<body>
<header th:replace="~{layout :: topbar('Budgets', null)}"></header>
<main>
    <div th:replace="~{budget-fragments :: switcher('year')}"></div>

    <div class="period">
        <a class="icon-btn" th:href="@{/yearly(date=${previous})}" aria-label="Previous year"><svg th:replace="~{layout :: left}"></svg></a>
        <div class="label">
            <span th:text="${date.year}">Year</span>
            <a th:unless="${isCurrent}" th:href="@{/yearly}">Back to this year</a>
        </div>
        <a class="icon-btn" th:href="@{/yearly(date=${next})}" aria-label="Next year"><svg th:replace="~{layout :: right}"></svg></a>
    </div>
    <p class="hint" style="margin: -4px 4px 12px 4px;">Each month counts against the plan in effect then. The tick on each bar is where the plan says you'd be by today.</p>

    <th:block th:each="b, iter : ${budgets}">
        <div class="section-title" th:if="${iter.first || budgets[iter.index - 1].group != b.group}"
             th:text="${b.budget.name == 'No Budget' ? 'Not in the plan' : b.group.label}">Monthly</div>
        <div th:replace="~{budget-fragments :: budget-card(${b}, ${start}, ${end}, true)}"></div>
    </th:block>
</main>
<nav th:replace="~{layout :: tabs('budgets')}"></nav>
</body>
</html>
