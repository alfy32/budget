<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Create Transaction')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<main>
    <h2>Create Transaction</h2>
    <form method="post" th:action="@{/create-transaction}">
        <div class="label">Amount</div>
        <input type="number" step="0.01" inputmode="decimal" name="amount" required autofocus>

        <div class="label">Account</div>
        <select name="account">
            <option th:each="account : ${accounts}" th:value="${account}" th:text="${account}"></option>
        </select>

        <div class="label">Description</div>
        <input type="text" name="description" required>

        <div class="label">Date</div>
        <input type="date" name="date" th:value="${today}" required>

        <div class="label">Transaction Type</div>
        <select name="transactionType">
            <option value="debit">debit</option>
            <option value="credit">credit</option>
        </select>

        <br><br>
        <button class="button" type="submit">Create Transaction</button>
    </form>
</main>
</body>
</html>
