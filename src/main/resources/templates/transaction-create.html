<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Add transaction')}"></head>
<body>
<header th:replace="~{layout :: topbar('Add transaction', @{/})}"></header>
<main>
    <form method="post" th:action="@{/create-transaction}">
        <div class="card padded">
            <div class="segmented">
                <label><input type="radio" name="transactionType" value="debit" checked><span>Debit (spent)</span></label>
                <label><input type="radio" name="transactionType" value="credit"><span>Credit (in)</span></label>
            </div>

            <label class="field spaced">
                <span class="field-label">Amount</span>
                <input type="number" step="0.01" min="0" inputmode="decimal" name="amount" placeholder="0.00" required>
            </label>

            <label class="field">
                <span class="field-label">Description</span>
                <input type="text" name="description" required>
            </label>

            <label class="field">
                <span class="field-label">Account</span>
                <select name="account">
                    <option th:each="account : ${accounts}" th:value="${account}" th:text="${account}"></option>
                </select>
            </label>

            <label class="field">
                <span class="field-label">Date</span>
                <input type="date" name="date" th:value="${today}" required>
            </label>
        </div>

        <div class="buttons">
            <button class="btn" type="submit">Add transaction</button>
        </div>
    </form>
</main>
<nav th:replace="~{layout :: tabs('home')}"></nav>
</body>
</html>
